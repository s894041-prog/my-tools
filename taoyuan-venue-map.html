<style>

      --ink:#F2E8E4;

      --accent:#FF6B7E;

      --accent-2:#5FC3DA;

      --map-land:#2B2124;
      --chip-bg:#2E2226;

    --surface:#251C20;
    --surface-2:#2E2226;
    --ink:#F2E8E4;
    --ink-muted:#B7A39C;
    --accent:#FF6B7E;
    --accent-ink:#221217;

    --line:#3B2C30;
    --line-strong:#4E3B40;
    --pin-shadow:rgba(0,0,0,.55);
    --map-water:#1E2B30;
    --map-land:#2B2124;
    --chip-bg:#2E2226;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
    font-variant-numeric:tabular-nums;
  }
  .page{max-width:1280px;margin:0 auto;padding:28px 20px 60px;}

  header.top{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    padding-bottom:20px;
    margin-bottom:24px;
    border-bottom:2px solid var(--line-strong);
  }
  .title-block .eyebrow{
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.14em;
    color:var(--accent);
    text-transform:uppercase;
  }
  .title-block h1{
    font-family:"Noto Serif TC",serif;
    font-weight:900;
    font-size:clamp(26px,4vw,38px);
    margin:.15em 0 .1em;
    text-wrap:balance;
    letter-spacing:.01em;
  }
  .title-block p{
    margin:0;
    color:var(--ink-muted);
    font-size:14.5px;
    max-width:56ch;
  }
  .meta-stats{
    display:flex;
    gap:22px;
  }
  .meta-stats div{text-align:right;}
  .meta-stats .num{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:26px;
    color:var(--accent-2);
    display:block;
    line-height:1;
  }
  .meta-stats .lbl{
    font-size:12px;
    color:var(--ink-muted);
  }

  .layout{
    display:grid;
    grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);
    gap:22px;
    align-items:start;
  }
  @media (max-width:880px){
    .layout{grid-template-columns:1fr;}
  }

  .map-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px 18px 14px;
    box-shadow:0 1px 2px rgba(38,25,30,.05);
  }
  .map-card h2{
    font-family:"Noto Serif TC",serif;
    font-size:16px;
    margin:0 0 10px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .map-card h2 small{
    font-family:"Noto Sans TC",sans-serif;
    font-weight:400;
    color:var(--ink-muted);
    font-size:12px;
  }
  .map-wrap{
    position:relative;
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  svg.mapsvg{display:block;width:100%;height:auto;background:var(--map-land);}
  .compass{font-size:11px;fill:var(--ink-muted);font-family:"Noto Sans TC",sans-serif;}
  .district-label{
    font-family:"Noto Serif TC",serif;
    font-size:15px;
    fill:var(--ink-muted);
    opacity:.55;
    letter-spacing:.06em;
  }
  .coast{fill:var(--map-water);}
  .grid-line{stroke:var(--line);stroke-width:1;}

  .pin{cursor:pointer;}
  .pin circle.halo{fill:var(--accent);opacity:0;transition:opacity .15s ease;}
  .pin:hover circle.halo, .pin.active circle.halo{opacity:.16;}
  .pin circle.dot{
    fill:var(--accent);
    stroke:var(--surface);
    stroke-width:1.6;
    filter:drop-shadow(0 1px 1.5px var(--pin-shadow));
    transition:r .12s ease;
  }
  .pin:hover circle.dot, .pin.active circle.dot{r:7.5;}
  .pin text.num{
    font-size:8px;
    font-weight:700;
    fill:var(--accent-ink);
    text-anchor:middle;
    pointer-events:none;
    font-family:"Noto Sans TC",sans-serif;
  }

  .tooltip{
    position:absolute;
    pointer-events:none;
    background:var(--ink);
    color:var(--bg);
    padding:8px 11px;
    border-radius:9px;
    font-size:12.5px;
    line-height:1.5;
    max-width:230px;
    box-shadow:0 6px 18px rgba(0,0,0,.25);
    opacity:0;
    transform:translate(-50%,-100%);
    transition:opacity .1s ease;
    z-index:20;
  }
  .tooltip.show{opacity:1;}
  .tooltip b{display:block;font-size:13px;margin-bottom:2px;}
  .tooltip span.addr{opacity:.75;}

  .legend-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--ink-muted);
    margin-top:10px;
    flex-wrap:wrap;
  }
  .legend-row .swatch{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    display:inline-block;
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }

  .side{
    display:flex;
    flex-direction:column;
    gap:14px;
    padding-right:4px;
  }
  .district-group{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .district-group .dg-head{

    align-items:center;
    justify-content:space-between;

    font-weight:700;
    font-size:14.5px;
    background:var(--surface-2);
  }

    font-weight:600;
    font-size:11.5px;
    color:var(--accent-2);
    background:var(--chip-bg);
    padding:2px 8px;
    border-radius:999px;
  }
  .venue-item{
    padding:10px 14px;
    border-top:1px solid var(--line);
    font-size:13px;
    cursor:pointer;
    transition:background .12s ease;
  }
  .venue-item:hover, .venue-item.active{background:var(--surface-2);}

    font-size:12px;
    margin-top:2px;
  }
  .venue-item .vaddr{
    color:var(--ink-muted);
    font-size:11.5px;
    margin-top:2px;
  }
  .venue-item .vnum{

    align-items:center;
    justify-content:center;
    width:16px;height:16px;
    border-radius:50%;
    background:var(--accent);
    color:var(--accent-ink);
    font-size:9.5px;
    font-weight:700;
    margin-right:6px;
  }
  .venue-item .vrow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .navlink{
    flex:none;
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-size:11px;
    font-weight:600;
    color:var(--accent-2);
    text-decoration:none;
    border:1px solid var(--line-strong);
    border-radius:999px;
    padding:3px 9px;
    white-space:nowrap;
    transition:background .12s ease, color .12s ease;
  }
  .navlink:hover{background:var(--accent-2);color:var(--surface);border-color:var(--accent-2);}
  .tooltip .navlink{
    margin-top:6px;
    pointer-events:auto;
    border-color:rgba(255,255,255,.35);
    color:var(--bg);
  }
  .tooltip .navlink:hover{background:var(--bg);color:var(--ink);}

  footer.note{
    margin-top:22px;
    font-size:11.5px;
    color:var(--ink-muted);
    border-top:1px solid var(--line);
    padding-top:12px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;

</style>

  {id:11, district:"中壢區", name:"中壢公九公園溜冰場", addr:"中壢區新明路320號", lat:24.9619964, lon:121.2158821, sports:["滑輪溜冰(競速)"]},

  {id:33, district:"觀音區", name:"崙坪文化地景園區", addr:"觀音區學府路350巷120號", lat:24.9992282, lon:121.1658982, sports:["飛盤(高爾夫)"]},

];

const lats = venues.map(v=>v.lat), lons = venues.map(v=>v.lon);
const latMin = Math.min(...lats)-0.015, latMax = Math.max(...lats)+0.015;
const lonMin = Math.min(...lons)-0.02, lonMax = Math.max(...lons)+0.02;
const W = 760, H = 860, padL = 40, padT = 30, padR = 40, padB = 30;
const mapW = W-padL-padR, mapH = H-padT-padB;

function project(lat, lon){
  const x = padL + (lon-lonMin)/(lonMax-lonMin) * mapW;
  const y = padT + (latMax-lat)/(latMax-latMin) * mapH;
  return [x,y];
}

const pinsG = document.getElementById("pins");
const tooltip = document.getElementById("tooltip");
const svgNS = "http://www.w3.org/2000/svg";

venues.forEach(v=>{
  const [x,y] = project(v.lat, v.lon);
  const g = document.createElementNS(svgNS,"g");
  g.setAttribute("class","pin");
  g.setAttribute("data-id", v.id);
  g.innerHTML = `
    <circle class="halo" cx="${x}" cy="${y}" r="16"></circle>
    <circle class="dot" cx="${x}" cy="${y}" r="6.2"></circle>
    <text class="num" x="${x}" y="${y+2.6}">${v.id}</text>
  `;
  g.addEventListener("mouseenter", ()=>showTip(v,x,y));
  g.addEventListener("mouseleave", hideTip);
  g.addEventListener("click", ()=>{ window.open(navUrl(v), "_blank", "noopener"); });
  pinsG.appendChild(g);
});

const districtLabelPos = {
  "桃園區":[520,470], "龜山區":[560,150], "中壢區":[300,470],
  "龍潭區":[220,700], "大溪區":[330,300], "復興區":[560,300],
  "蘆竹區":[560,90], "大園區":[210,110], "觀音區":[80,470]
};
const dG = document.getElementById("districtLabels");
Object.entries(districtLabelPos).forEach(([name,pos])=>{
  const t = document.createElementNS(svgNS,"text");
  t.setAttribute("class","district-label");
  t.setAttribute("x", pos[0]); t.setAttribute("y", pos[1]);
  t.textContent = name;
  dG.appendChild(t);
});

function navUrl(v){
  return "https://www.google.com/maps/search/?api=1&query=" + v.lat + "," + v.lon;
}

function showTip(v,x,y){
  const wrap = document.querySelector(".map-wrap").getBoundingClientRect();
  const svgEl = document.getElementById("mapsvg").getBoundingClientRect();
  const scale = svgEl.width / W;
  tooltip.innerHTML = `<b>${v.id}. ${v.name}</b><span class="addr">${v.sports.join("、")}</span><br><span class="addr">${v.addr}</span><br><span class="addr" style="opacity:.6">點一下場館可開啟導航 →</span>`;
  tooltip.style.left = (x*scale) + "px";
  tooltip.style.top = (y*scale - 10) + "px";
  tooltip.classList.add("show");
  document.querySelectorAll(".pin").forEach(p=>p.classList.toggle("active", p.dataset.id==v.id));
  document.querySelectorAll(".venue-item").forEach(el=>el.classList.toggle("active", el.dataset.id==v.id));
}
function hideTip(){
  tooltip.classList.remove("show");
  document.querySelectorAll(".pin").forEach(p=>p.classList.remove("active"));
}
function focusVenue(id){
  const el = document.querySelector(`.venue-item[data-id="${id}"]`);
  if(el){
    el.scrollIntoView({behavior:"smooth", block:"center"});
    el.classList.add("active");
    setTimeout(()=>el.classList.remove("active"), 1600);
  }
}

const byDistrict = {};
venues.forEach(v=>{ (byDistrict[v.district] ||= []).push(v); });
const districtOrder = ["桃園區","龜山區","中壢區","龍潭區","大溪區","復興區","蘆竹區","大園區","觀音區"];
const side = document.getElementById("sideList");
districtOrder.forEach(dist=>{
  const list = byDistrict[dist];
  if(!list) return;
  const det = document.createElement("div");
  det.className = "district-group";
  const sportCount = list.reduce((a,v)=>a+v.sports.length,0);
  det.innerHTML = `<div class="dg-head">${dist} <span class="cnt">${sportCount} 項 · ${list.length} 館</span></div>`;
  list.forEach(v=>{
    const item = document.createElement("div");
    item.className = "venue-item";
    item.dataset.id = v.id;
    item.innerHTML = `
      <div class="vrow">
        <div class="vname"><span class="vnum">${v.id}</span>${v.name}</div>
        <a class="navlink" href="${navUrl(v)}" target="_blank" rel="noopener">🧭 導航</a>
      </div>
      <div class="vsports">${v.sports.join("、")}</div>
      <div class="vaddr">${v.addr}</div>
    `;
    item.addEventListener("mouseenter", ()=>{
      const [x,y] = project(v.lat, v.lon);
      showTip(v,x,y);
    });
    item.addEventListener("mouseleave", hideTip);
    det.appendChild(item);
  });
  side.appendChild(det);
});
</script>
