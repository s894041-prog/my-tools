<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>115全民運動會 · 桃園競賽場館與交通接駁分布圖 (1-34場館版)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --surface-2: #F1F5F9;
    --ink: #0F172A;
    --ink-muted: #64748B;
    --accent: #E84091;
    --accent-ink: #FFFFFF;
    --accent-2: #0284C7;
    --accent-2-light: #E0F2FE;
    --line: #E2E8F0;
    --line-strong: #CBD5E1;
    --map-land: #FFF9FB;
    --chip-bg: #F1F5F9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1120;
      --surface: #1E293B;
      --surface-2: #334155;
      --ink: #F8FAFC;
      --ink-muted: #94A3B8;
      --accent: #FF5A9E;
      --accent-ink: #FFFFFF;
      --accent-2: #38BDF8;
      --accent-2-light: #082F49;
      --line: #334155;
      --line-strong: #475569;
      --map-land: #1E293B;
      --chip-bg: #334155;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-variant-numeric: tabular-nums;
    line-height: 1.45;
  }
  .page { max-width: 1580px; margin: 0 auto; padding: 14px 18px 30px; }

  /* 精巧緊緻的頂部標題列，節省垂直空間 */
  header.top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 10px;
    margin-bottom: 12px;
    border-bottom: 2px solid var(--line-strong);
  }
  .title-block .eyebrow {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .12em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .title-block h1 {
    font-family: "Noto Serif TC", serif;
    font-weight: 900;
    font-size: clamp(20px, 2.6vw, 28px);
    margin: .1em 0;
    color: var(--ink);
    letter-spacing: .02em;
  }
  .title-block p {
    margin: 0;
    color: var(--ink-muted);
    font-size: 13px;
  }
  .meta-stats {
    display: flex;
    gap: 16px;
  }
  .meta-stats div { text-align: right; }
  .meta-stats .num {
    font-family: "Noto Serif TC", serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--accent);
    display: block;
    line-height: 1;
  }
  .meta-stats .lbl {
    font-size: 11px;
    color: var(--ink-muted);
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(420px, 1fr);
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 1080px) {
    .layout { grid-template-columns: 1fr; }
  }

  .map-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.04);
  }
  
  .card-topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .tabs {
    display: flex;
    background: var(--surface-2);
    padding: 3px;
    border-radius: 8px;
    gap: 3px;
  }
  .tab-btn {
    border: none;
    background: transparent;
    padding: 6px 14px;
    font-size: 12.5px;
    font-weight: 700;
    font-family: inherit;
    border-radius: 6px;
    cursor: pointer;
    color: var(--ink-muted);
    transition: all .15s ease;
  }
  .tab-btn.active {
    background: var(--surface);
    color: var(--accent);
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  
  .action-links {
    display: flex;
    gap: 6px;
  }
  .btn-download {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    font-weight: 700;
    color: #0284C7;
    background: #F0F9FF;
    border: 1px solid #BAE6FD;
    border-radius: 6px;
    padding: 5px 10px;
    text-decoration: none;
    transition: all .15s ease;
  }
  .btn-download:hover {
    background: #0284C7;
    color: #FFF;
    border-color: #0284C7;
  }

  .map-wrap {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: #FFFFFF;
    height: calc(100vh - 190px);
    min-height: 480px;
    max-height: 720px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .poster-view {
    width: 100%;
    height: 100%;
    cursor: zoom-in;
    background: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .poster-view img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .zoom-hint {
    position: absolute;
    bottom: 10px;
    right: 12px;
    background: rgba(15, 23, 42, 0.82);
    color: #FFF;
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 6px;
    backdrop-filter: blur(6px);
    pointer-events: none;
  }

  .interactive-view {
    display: none;
    width: 100%;
    height: 100%;
    background: #FFFFFF;
  }
  svg.mapsvg {
    display: block;
    width: 100%;
    height: 100%;
    background: #FFFFFF;
    transition: all .25s ease;
  }
  
  /* 行政區多邊形樣式 */
  .dist-poly {
    stroke: #E84091;
    stroke-width: 2.2;
    stroke-linejoin: round;
    fill: #FFF9FB;
    transition: fill .2s ease, stroke .2s ease, stroke-width .2s ease, opacity .25s ease;
    cursor: pointer;
  }
  .dist-poly:hover { fill: #FFEBF4; }
  .dist-poly.inactive {
    stroke: #F4B0D0;
    stroke-width: 1.2;
    fill: #FAFAFA;
    cursor: default;
  }
  .dist-label {
    font-size: 12px;
    font-weight: 700;
    fill: #B89CA8;
    text-anchor: middle;
    pointer-events: none;
    transition: all .2s ease;
  }

  .dist-poly.active-district {
    fill: #FFE0EE !important;
    stroke: #D81B60 !important;
    stroke-width: 3.8 !important;
    filter: drop-shadow(0 0 10px rgba(216,27,96,0.32));
  }
  .dist-label.active-district-label {
    fill: #D81B60 !important;
    font-size: 14px !important;
    font-weight: 900 !important;
  }

  svg.mapsvg.has-active-district .dist-poly:not(.active-district):not(.inactive) {
    fill: #FAFAFA;
    stroke: #E2CBD5;
    opacity: 0.45;
  }
  svg.mapsvg.has-active-district .dist-label:not(.active-district-label) {
    opacity: 0.35;
  }
  svg.mapsvg.has-active-district .pin:not(.in-active-district) {
    opacity: 0.35;
  }
  svg.mapsvg.has-active-district .leader-line:not(.in-active-district),
  svg.mapsvg.has-active-district .orig-dot:not(.in-active-district) {
    opacity: 0.25;
  }
  
  .leader-line {
    stroke: #0284C7;
    stroke-width: 1.4;
    stroke-dasharray: 2, 2;
    opacity: 0.85;
    pointer-events: none;
    transition: all .2s ease;
  }
  .leader-line.hq {
    stroke: #E84091;
    stroke-width: 1.8;
    stroke-dasharray: none;
  }
  .leader-line.active {
    stroke: #E84091 !important;
    stroke-width: 2.6 !important;
    stroke-dasharray: none !important;
    opacity: 1 !important;
  }
  .orig-dot {
    fill: #0284C7;
    stroke: #FFFFFF;
    stroke-width: 1.0;
    pointer-events: none;
    transition: all .2s ease;
  }
  .orig-dot.hq {
    fill: #E84091;
    stroke: #F59E0B;
    stroke-width: 1.4;
  }
  .orig-dot.active {
    fill: #E84091 !important;
    stroke: #F59E0B !important;
    stroke-width: 2.0 !important;
    transform: scale(1.3);
  }

  @keyframes pin-pulse-glow {
    0% { r: 14px; opacity: 0.95; }
    50% { r: 28px; opacity: 0.25; }
    100% { r: 14px; opacity: 0.95; }
  }

  .pin {
    cursor: pointer;
    transition: opacity .25s ease;
  }
  .pin circle.halo {
    fill: #E84091;
    opacity: 0;
    transition: opacity .15s ease;
  }
  .pin:hover circle.halo { opacity: .35; }
  
  .pin circle.dot {
    fill: #00ABEB;
    stroke: #FFFFFF;
    stroke-width: 1.8;
    transition: all .2s cubic-bezier(.34,1.56,.64,1);
    transform-origin: center;
  }
  .pin.hq circle.dot {
    fill: #E84091;
    stroke: #F59E0B;
    stroke-width: 2.8;
  }
  .pin:hover circle.dot {
    fill: var(--accent);
    transform: scale(1.28);
  }
  .pin text.num {
    font-family: "Noto Sans TC", sans-serif;
    font-weight: 800;
    font-size: 8.5px;
    fill: #FFFFFF;
    text-anchor: middle;
    pointer-events: none;
    transition: all .2s ease;
  }

  .pin.active circle.halo {
    opacity: 1 !important;
    fill: #F59E0B !important;
    animation: pin-pulse-glow 1.4s infinite ease-in-out !important;
  }
  .pin.active circle.dot {
    fill: #E84091 !important;
    stroke: #FFFBEB !important;
    stroke-width: 2.8px !important;
    transform: scale(1.42) !important;
    filter: drop-shadow(0 0 10px rgba(232, 64, 145, 0.85)) drop-shadow(0 0 4px rgba(245, 158, 11, 0.9)) !important;
  }
  .pin.active text.num {
    font-size: 10px !important;
    font-weight: 900 !important;
  }

  .hq-svg-badge {
    font-family: "Noto Sans TC", sans-serif;
    font-weight: 800;
    font-size: 8px;
    fill: #D97706;
    pointer-events: none;
  }

  .tooltip {
    position: absolute;
    z-index: 30;
    background: rgba(15, 23, 42, 0.94);
    color: #FFF;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13.5px;
    line-height: 1.5;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -100%) translateY(-10px);
    transition: opacity .12s ease, transform .12s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
    max-width: 320px;
    backdrop-filter: blur(8px);
  }
  .tooltip.show {
    opacity: 1;
    transform: translate(-50%, -100%) translateY(-14px);
  }
  .tooltip b { display: block; font-size: 15px; margin-bottom: 2px; color: #38BDF8; }
  .tooltip .addr { font-size: 12px; color: #94A3B8; margin-bottom: 6px; }
  .tooltip .hq-tag { color: #F59E0B; font-weight: 800; font-size: 13px; margin-bottom: 4px; display: inline-block; background: rgba(245,158,11,.15); padding: 1px 6px; border-radius: 4px; }

  /* === 右側清單 (自適應螢幕高度 ＋ 永久醒目可滑動滾動條) === */
  .side-search {
    margin-bottom: 8px;
  }
  .search-input {
    width: 100%;
    padding: 8px 12px;
    font-size: 13.5px;
    font-family: inherit;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 3px rgba(0,0,0,.03);
    outline: none;
    transition: border-color .15s;
  }
  .search-input:focus {
    border-color: #0284C7;
    box-shadow: 0 0 0 3px rgba(2,132,199,.15);
  }

  /* 行政區快捷切換 Pills */
  .district-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 10px;
  }
  .dist-chip {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-muted);
    font-size: 11.5px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 16px;
    cursor: pointer;
    transition: all .15s ease;
    white-space: nowrap;
  }
  .dist-chip:hover {
    background: var(--surface-2);
    color: var(--ink);
    border-color: var(--line-strong);
  }
  .dist-chip.active {
    background: #0284C7;
    color: #FFFFFF;
    border-color: #0284C7;
    box-shadow: 0 2px 5px rgba(2,132,199,.25);
  }

  /* ★★★ 核心修復：自適應螢幕高度，確保所有場館完全在可滑動視窗內 ★★★ */
  .side {
    display: flex;
    flex-direction: column;
    gap: 12px;
    /* 永遠自適應視窗，不被推擠到螢幕底下！ */
    height: calc(100vh - 190px);
    min-height: 480px;
    max-height: 720px;
    overflow-y: scroll !important; /* 確保滾動條常駐且隨時能滑動！ */
    padding-right: 6px;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: #0284C7 #E2E8F0;
  }
  .side::-webkit-scrollbar {
    width: 9px;
  }
  .side::-webkit-scrollbar-track {
    background: #F1F5F9;
    border-radius: 6px;
  }
  .side::-webkit-scrollbar-thumb {
    background: #0284C7;
    border-radius: 6px;
    border: 2px solid #F1F5F9;
  }
  .side::-webkit-scrollbar-thumb:hover {
    background: #0369A1;
  }

  /* 行政區卡片 */
  .district-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.03);
  }
  
  .dist-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: #F8FAFC;
    border-bottom: 1px solid var(--line);
    border-left: 4px solid #0284C7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .dist-card-header {
      background: #1E293B;
      border-bottom: 1px solid #334155;
    }
  }
  
  .dist-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dist-count {
    font-size: 11px;
    font-weight: 800;
    color: #0284C7;
    background: #E0F2FE;
    padding: 2px 8px;
    border-radius: 999px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .dist-count {
      background: #0C4A6E;
      color: #38BDF8;
    }
  }

  /* 緊湊精緻場館排版 (Compact UI) */
  .venue-item {
    padding: 7px 12px;
    border-bottom: 1px solid var(--line);
    transition: all .15s ease;
    cursor: pointer;
  }
  .venue-item:last-child { border-bottom: none; }
  .venue-item:hover {
    background: var(--surface-2);
  }
  .venue-item.active {
    background: #F0F9FF;
    border-left: 4px solid #0284C7;
    padding-left: 8px;
    box-shadow: inset 0 0 10px rgba(2,132,199,.06);
  }
  .venue-item.hq.active {
    background: #FFF5F9;
    border-left: 4px solid #E84091;
  }
  
  .vrow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .vhead {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .vnum {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 20px;
    background: #00ABEB;
    color: #FFF;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 800;
    padding: 0 3px;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
  }
  .venue-item.hq .vnum {
    background: #E84091;
    box-shadow: 0 0 0 2px #F59E0B;
  }
  .venue-item.active .vnum {
    background: #E84091;
    box-shadow: 0 0 0 2px #F59E0B;
  }
  .vname {
    font-weight: 800;
    font-size: 13.5px;
    color: var(--ink);
  }
  .hq-badge {
    background: #FFFBEB;
    color: #D97706;
    border: 1px solid #F59E0B;
    font-size: 10px;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 4px;
  }
  .vsublist {
    margin: 3px 0 2px 26px;
    padding: 0;
    list-style: none;
    font-size: 12px;
    color: var(--ink-muted);
    line-height: 1.4;
  }
  .vsublist li {
    position: relative;
    padding-left: 10px;
    margin-bottom: 1px;
  }
  .vsublist li::before {
    content: "•";
    position: absolute;
    left: 0;
    color: #E84091;
    font-weight: bold;
    font-size: 12px;
  }
  .vaddr {
    font-size: 11px;
    color: var(--ink-muted);
    margin-left: 26px;
  }
  .navlink {
    font-size: 11px;
    font-weight: 700;
    color: #0284C7;
    background: #F0F9FF;
    border: 1px solid #BAE6FD;
    border-radius: 999px;
    padding: 2px 9px;
    white-space: nowrap;
    text-decoration: none;
    transition: all .12s ease;
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }
  .navlink:hover {
    background: #0284C7;
    color: #FFF;
    border-color: #0284C7;
  }

  footer.note {
    margin-top: 14px;
    font-size: 11.5px;
    color: var(--ink-muted);
    border-top: 1px solid var(--line);
    padding-top: 8px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
</style>
</head>
<body>

<div class="page">
  <header class="top">
    <div class="title-block">
      <div class="eyebrow">115 全民運動會 · 交通排車與場館分布</div>
      <h1>桃園場館與交通接駁分布圖</h1>
      <p>涵蓋 34 處官方賽事場館地點與【臺中市隊本部】。編號 1~34 與派車手冊及海報 100% 吻合，點擊場館可開啟 Google 地圖導航。</p>
    </div>
    <div class="meta-stats">
      <div><span class="num">34</span><span class="lbl">場館編號</span></div>
      <div><span class="num">9</span><span class="lbl">行政區</span></div>
      <div><span class="num">1</span><span class="lbl">隊本部(北科附工)</span></div>
    </div>
  </header>

  <div class="layout">
    <div class="map-card">
      <div class="card-topbar">
        <div class="tabs">
          <button class="tab-btn active" id="tabPoster" onclick="switchView('poster')">🗺️ 官方接駁分布圖 (海報版)</button>
          <button class="tab-btn" id="tabInteractive" onclick="switchView('interactive')">🧭 互動定位導航地圖</button>
        </div>
        <div class="action-links">
          <a class="btn-download" href="taoyuan-venue-map.png" target="_blank" download="115全民運_桃園場館分布圖(交通排車1-34版).png">📥 下載大圖 (PNG)</a>
          <a class="btn-download" href="taoyuan-venue-map.pdf" target="_blank" download="115全民運_桃園場館分布圖(交通排車1-34版).pdf">📄 向量 PDF</a>
        </div>
      </div>

      <div class="map-wrap">
        <div class="poster-view" id="posterView" onclick="window.open('taoyuan-venue-map.png', '_blank')">
          <img src="taoyuan-venue-map.png" alt="115年全民運動會 桃園競賽場館與交通接駁分布圖" />
          <div class="zoom-hint">🔍 點擊開新分頁檢視 300 DPI 超清原圖</div>
        </div>

        <div class="interactive-view" id="interactiveView">
          <svg class="mapsvg" viewBox="0 0 760 860" id="mapsvg">
            <g id="districtsG"></g>
            <g id="districtLabelsG"></g>
            <g id="leadersG"></g>
            <g id="pinsG"></g>
          </svg>
          <div class="tooltip" id="tooltip"></div>
        </div>
      </div>
    </div>

    <!-- 右側依行政區彙整清單 -->
    <div>
      <div class="side-search">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜尋場館編號、學校、運動項目或行政區..." oninput="onSearchInput()">
      </div>

  "復興區": [550, 520]
};

function initMap() {
  const districtsG = document.getElementById("districtsG");
  const districtLabelsG = document.getElementById("districtLabelsG");
  const leadersG = document.getElementById("leadersG");
  const pinsG = document.getElementById("pinsG");

  svgDistricts.forEach(d => {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d.d);
    path.setAttribute("id", "dist-poly-" + d.name);
    path.setAttribute("data-district", d.name);
    path.setAttribute("class", "dist-poly" + (districtOrder.includes(d.name) ? "" : " inactive"));
    
    if (districtOrder.includes(d.name)) {
      path.addEventListener("click", () => {
        setDistrictFilter(d.name);
      });
    }
    
    districtsG.appendChild(path);

    if (districtCentroids[d.name]) {
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("class", "dist-label");
      text.setAttribute("id", "dist-lbl-" + d.name);
      text.setAttribute("x", districtCentroids[d.name][0]);
      text.setAttribute("y", districtCentroids[d.name][1]);
      text.textContent = d.name;
      districtLabelsG.appendChild(text);
    }
  });

  venues.forEach(v => {
    const isHq = v.is_hq;

    if (v.has_offset) {
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", v.orig_x);
      line.setAttribute("y1", v.orig_y);
      line.setAttribute("x2", v.svg_x);
      line.setAttribute("y2", v.svg_y);
      line.setAttribute("id", "leader-" + v.id);
      line.setAttribute("data-district", v.district);
      line.setAttribute("class", "leader-line" + (isHq ? " hq" : ""));
      leadersG.appendChild(line);

      const origCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      origCircle.setAttribute("cx", v.orig_x);
      origCircle.setAttribute("cy", v.orig_y);
      origCircle.setAttribute("r", isHq ? 3.5 : 2.5);
      origCircle.setAttribute("id", "orig-" + v.id);
      origCircle.setAttribute("data-district", v.district);
      origCircle.setAttribute("class", "orig-dot" + (isHq ? " hq" : ""));
      leadersG.appendChild(origCircle);
    }

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "pin" + (isHq ? " hq" : ""));
    g.setAttribute("id", "pin-" + v.id);
    g.setAttribute("data-district", v.district);

    const halo = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    halo.setAttribute("class", "halo");
    halo.setAttribute("cx", v.svg_x);
    halo.setAttribute("cy", v.svg_y);
    halo.setAttribute("r", isHq ? 20 : 15);
    g.appendChild(halo);

    const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    dot.setAttribute("class", "dot");
    dot.setAttribute("cx", v.svg_x);
    dot.setAttribute("cy", v.svg_y);
    dot.setAttribute("r", isHq ? 12 : 9.5);
    g.appendChild(dot);

    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("class", "num");
    text.setAttribute("x", v.svg_x);
    text.setAttribute("y", v.svg_y + 3.2);
    text.textContent = v.id;
    g.appendChild(text);

    if (isHq) {
      const hqRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      hqRect.setAttribute("x", v.svg_x - 52);
      hqRect.setAttribute("y", v.svg_y - 8);
      hqRect.setAttribute("width", 36);
      hqRect.setAttribute("height", 16);
      hqRect.setAttribute("rx", 4);
      hqRect.setAttribute("fill", "#FFFBEB");
      hqRect.setAttribute("stroke", "#F59E0B");
      hqRect.setAttribute("stroke-width", 0.8);
      g.appendChild(hqRect);

      const hqText = document.createElementNS("http://www.w3.org/2000/svg", "text");
      hqText.setAttribute("class", "hq-svg-badge");
      hqText.setAttribute("x", v.svg_x - 34);
      hqText.setAttribute("y", v.svg_y + 3.5);
      hqText.setAttribute("text-anchor", "middle");
      hqText.textContent = "★隊本部";
      g.appendChild(hqText);
    }

    g.addEventListener("mouseenter", (e) => showTooltip(v, e));
    g.addEventListener("mouseleave", hideTooltip);
    g.addEventListener("click", () => selectVenue(v.id, v.district));

    pinsG.appendChild(g);
  });
}

function renderChips() {
  const container = document.getElementById("districtChips");
  container.innerHTML = "";

  const allChip = document.createElement("button");
  allChip.className = "dist-chip" + (activeDistrictFilter === "ALL" ? " active" : "");
  allChip.textContent = `全部 (34)`;
  allChip.onclick = () => setDistrictFilter("ALL");
  container.appendChild(allChip);

  districtOrder.forEach(dist => {
    const count = venues.filter(v => v.district === dist).length;
    const chip = document.createElement("button");
    chip.className = "dist-chip" + (activeDistrictFilter === dist ? " active" : "");
    chip.textContent = `${dist} (${count})`;
    chip.onclick = () => setDistrictFilter(dist);
    container.appendChild(chip);
  });
}

function setDistrictFilter(dist) {
  activeDistrictFilter = dist;
  renderChips();
  renderSideList();

  const mapsvg = document.getElementById("mapsvg");
  document.querySelectorAll(".dist-poly").forEach(p => p.classList.remove("active-district"));
  document.querySelectorAll(".dist-label").forEach(l => l.classList.remove("active-district-label"));
  document.querySelectorAll(".pin").forEach(p => p.classList.remove("in-active-district"));
  document.querySelectorAll(".leader-line").forEach(l => l.classList.remove("in-active-district"));
  document.querySelectorAll(".orig-dot").forEach(d => d.classList.remove("in-active-district"));

  if (dist === "ALL") {
    mapsvg.classList.remove("has-active-district");
  } else {
    mapsvg.classList.add("has-active-district");
    
    const activePath = document.getElementById("dist-poly-" + dist);
    if (activePath) activePath.classList.add("active-district");

    const activeLbl = document.getElementById("dist-lbl-" + dist);
    if (activeLbl) activeLbl.classList.add("active-district-label");

    document.querySelectorAll(`.pin[data-district="${dist}"]`).forEach(p => p.classList.add("in-active-district"));
    document.querySelectorAll(`.leader-line[data-district="${dist}"]`).forEach(l => l.classList.add("in-active-district"));
    document.querySelectorAll(`.orig-dot[data-district="${dist}"]`).forEach(d => d.classList.add("in-active-district"));

    // 內部滾動至頂部
    const sideList = document.getElementById("sideList");
    if (sideList) sideList.scrollTop = 0;
  }
}

function onSearchInput() {
  const val = document.getElementById("searchInput").value;
  renderSideList(val);
}

function renderSideList(filterText = "") {
  const container = document.getElementById("sideList");
  container.innerHTML = "";
  const query = (filterText || document.getElementById("searchInput").value).trim().toLowerCase();

  const targetDistricts = activeDistrictFilter === "ALL" ? districtOrder : [activeDistrictFilter];

  targetDistricts.forEach((dist) => {
    const distVenues = venues.filter(v => v.district === dist);
    const filtered = distVenues.filter(v => {
      if (!query) return true;
      return v.name.toLowerCase().includes(query) ||
             v.district.toLowerCase().includes(query) ||
             String(v.id) === query ||
             v.sub_items.some(s => s.toLowerCase().includes(query));
    });

    if (filtered.length === 0) return;

    const card = document.createElement("div");
    card.className = "district-card";
    card.id = "dist-card-" + dist;

    const head = document.createElement("div");
    head.className = "dist-card-header";
    head.innerHTML = `
      <div class="dist-title">📍 ${dist}</div>
      <span class="dist-count">${filtered.length} 處場館</span>
    `;
    head.style.cursor = "pointer";
    head.onclick = () => setDistrictFilter(dist);
    card.appendChild(head);

    const body = document.createElement("div");
    filtered.forEach(v => {
      const item = document.createElement("div");
      item.className = "venue-item" + (v.is_hq ? " hq" : "");
      item.id = "item-" + v.id;
      
      const subListHtml = v.sub_items.map(s => `<li>${s}</li>`).join("");
      const hqHtml = v.is_hq ? `<span class="hq-badge">⭐ 隊本部</span>` : "";

      item.innerHTML = `
        <div class="vrow">
          <div class="vhead">
            <span class="vnum">${v.id}</span>
            <span class="vname">${v.name}</span>
            ${hqHtml}
          </div>
          <a class="navlink" href="https://www.google.com/maps/search/?api=1&query=${v.lat},${v.lon}" target="_blank">🧭 導航</a>
        </div>
        <ul class="vsublist">${subListHtml}</ul>
        <div class="vaddr">📍 ${v.addr}</div>
      `;

      item.addEventListener("click", (e) => {
        if (e.target.tagName.toLowerCase() !== "a") {
          selectVenue(v.id, v.district);
        }
      });

      body.appendChild(item);
    });

    card.appendChild(body);
    container.appendChild(card);
  });
}

function selectVenue(id, district = null) {
  switchView('interactive');

  document.querySelectorAll(".pin").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".venue-item").forEach(i => i.classList.remove("active"));
  document.querySelectorAll(".leader-line").forEach(l => l.classList.remove("active"));
  document.querySelectorAll(".orig-dot").forEach(d => d.classList.remove("active"));

  const pin = document.getElementById("pin-" + id);
  if (pin) {
    pin.classList.add("active");
    
    const leader = document.getElementById("leader-" + id);
    if (leader) leader.classList.add("active");
    const origDot = document.getElementById("orig-" + id);
    if (origDot) origDot.classList.add("active");

    const v = venues.find(item => item.id === id);
    if (v) showTooltip(v);
  }

  if (district) {
    const activePath = document.getElementById("dist-poly-" + district);
    if (activePath && !activePath.classList.contains("active-district")) {
      document.querySelectorAll(".dist-poly").forEach(p => p.classList.remove("active-district"));
      activePath.classList.add("active-district");
    }
  }

  const item = document.getElementById("item-" + id);
  const container = document.getElementById("sideList");
  if (item && container) {
    item.classList.add("active");
    // 精準在內部容器滾動至目標，不牽動全螢幕 window
    const itemOffset = item.offsetTop - container.offsetTop - 20;
    container.scrollTo({ top: itemOffset, behavior: "smooth" });
  }
}

function showTooltip(v, e) {
  const tt = document.getElementById("tooltip");
  const rect = document.getElementById("mapsvg").getBoundingClientRect();
  const scale = rect.width / 760;
  
  const hqTag = v.is_hq ? `<div class="hq-tag">⭐ 臺中市代表隊隊本部</div>` : "";
  const subHtml = v.sub_items.map(s => `<div>• ${s}</div>`).join("");
  
  tt.innerHTML = `
    ${hqTag}
    <b>${v.name}</b>
    <div class="addr">${v.addr}</div>
    <div style="font-size:12px;color:#94A3B8;border-top:1px solid rgba(255,255,255,0.15);padding-top:6px;margin-top:6px;">
      ${subHtml}
    </div>
  `;
  tt.style.left = (v.svg_x * scale) + "px";
  tt.style.top = (v.svg_y * scale) + "px";
  tt.classList.add("show");
}

function hideTooltip() {
}

function switchView(mode) {
  document.getElementById("tabPoster").classList.toggle("active", mode === "poster");
  document.getElementById("tabInteractive").classList.toggle("active", mode === "interactive");
  document.getElementById("posterView").style.display = mode === "poster" ? "block" : "none";
  document.getElementById("interactiveView").style.display = mode === "interactive" ? "block" : "none";
}

window.addEventListener("DOMContentLoaded", () => {
  initMap();
  renderChips();
  renderSideList();
});
</script>
</body>
</html>
