<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎯 課堂賓果分組互動工具</title>
  <style>
    :root {
      --bg-page: #f0f5ff;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --correct: #10b981;
      --correct-dark: #059669;
      --wrong: #f43f5e;
      --wrong-dark: #e11d48;
      --amber: #f59e0b;
      --line-stroke: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #e0e7ff 0%, #f0fdf4 50%, #fef3c7 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      user-select: none;
    }

    /* 頂部工具列 */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-card);
      padding: 10px 16px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
      border: 1px solid #e2e8f0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #1e3a8a;
      letter-spacing: 0.5px;
    }

    .unit-badge {
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
    }

    .sync-status {
      font-size: 0.78rem;
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--bg-subtle);
      border: 1px solid #e2e8f0;
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .group-switcher {
      display: flex;
      align-items: center;
      background: var(--bg-subtle);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      gap: 3px;
    }

    .group-switcher span {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0 6px;
    }

    .grp-btn {
      border: none;
      background: transparent;
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s;
    }

    .grp-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 5px rgba(37, 99, 235, 0.3);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.12s, background-color 0.15s, box-shadow 0.15s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-outline {
      background: #fff;
      border-color: var(--border-color);
      color: var(--text-main);
    }

    .btn-outline:hover {
      background: var(--bg-subtle);
      border-color: #94a3b8;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-indigo {
      background: #4f46e5;
      color: #fff;
    }

    .btn-indigo:hover {
      background: #4338ca;
    }

    /* 上半部：左題目區 + 右 4x4 題號區 */
    .upper-section {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 14px;
    }

    @media (max-width: 960px) {
      .upper-section {
        grid-template-columns: 1fr;
      }
    }

    /* 題目主面板 */
    .question-panel {
      background: var(--bg-card);
      border-radius: 18px;
      padding: 16px 20px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
      border: 2px solid #bfdbfe;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .question-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .q-badge-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .q-number-badge {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 10px;
      box-shadow: 0 3px 8px rgba(37, 99, 235, 0.25);
    }

    .q-status-tag {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .tts-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .tts-toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      background: var(--bg-subtle);
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .question-stage {
      background: linear-gradient(180deg, #f8fafc 0%, #eff6ff 100%);
      border: 2px dashed #93c5fd;
      border-radius: 14px;
      padding: 20px 24px;
      min-height: 128px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      position: relative;
    }

    .question-text {
      font-size: clamp(1.35rem, 2.4vw, 2rem);
      font-weight: 800;
      color: #0f172a;
      line-height: 1.4;
      word-break: break-word;
    }

    .answer-reveal-box {
      background: #fef3c7;
      border: 1px solid #fde68a;
      color: #92400e;
      font-weight: 800;
      font-size: 1.1rem;
      padding: 5px 16px;
      border-radius: 999px;
      display: none;
    }

    .answer-reveal-box.visible {
      display: inline-block;
    }

    .judge-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .judge-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-correct {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-size: 1.05rem;
      padding: 10px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-correct:hover {
      background: linear-gradient(135deg, #059669, #047857);
    }

    .btn-wrong {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      color: #fff;
      font-size: 1.05rem;
      padding: 10px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
    }

    .btn-wrong:hover {
      background: linear-gradient(135deg, #e11d48, #be123c);
    }

    /* 右側：4x4 題號選擇盤 */
    .selector-panel {
      background: var(--bg-card);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .selector-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .selector-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #1e293b;
    }

    .selector-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .q-num-btn {
      height: 44px;
      border-radius: 10px;
      border: 2px solid #cbd5e1;
      background: #f8fafc;
      font-size: 1.05rem;
      font-weight: 800;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .q-num-btn:hover {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .q-num-btn.current {
      border-color: var(--primary);
      background: #dbeafe;
      color: #1e40af;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
    }

    .q-num-btn.answered-correct {
      background: var(--correct);
      border-color: var(--correct-dark);
      color: #fff;
    }

    .q-num-btn.answered-wrong {
      background: #fef3c7;
      border-color: #f59e0b;
      color: #b45309;
    }

    /* 下半部：各組 4x4 賓果分組盤 */
    .groups-section {
      display: grid;
      gap: 12px;
      flex: 1;
    }

    .groups-count-2 { grid-template-columns: repeat(2, 1fr); }
    .groups-count-3 { grid-template-columns: repeat(3, 1fr); }
    .groups-count-4 { grid-template-columns: repeat(4, 1fr); }
    .groups-count-5 { grid-template-columns: repeat(5, 1fr); }

    @media (max-width: 1024px) {
      .groups-count-4, .groups-count-5 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .groups-count-2, .groups-count-3, .groups-count-4, .groups-count-5 {
        grid-template-columns: 1fr;
      }
    }

    .group-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
      border: 3px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .group-card.has-bingo {
      box-shadow: 0 8px 22px rgba(245, 158, 11, 0.18);
    }

    .group-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .group-name-badge {
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
      padding: 4px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .line-counter {
      font-size: 0.88rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #475569;
    }

    .line-counter.active-lines {
      background: #fef3c7;
      color: #b45309;
      border: 1px solid #f59e0b;
    }

    /* 賓果盤容器 (含 SVG 連線覆蓋層) */
    .bingo-board-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 290px;
      margin: 0 auto;
    }

    .bingo-grid {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 6px;
    }

    .bingo-cell {
      border-radius: 10px;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.05rem, 1.8vw, 1.35rem);
      font-weight: 800;
      color: #334155;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .bingo-cell.current-highlight {
      border-color: var(--primary);
      background: #eff6ff;
      color: var(--primary);
    }

    /* 答對後所有組別該數字一起變色 */
    .bingo-cell.lit {
      color: #fff;
      transform: scale(1.02);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.14);
    }

    .bingo-cell.in-line {
      box-shadow: 0 0 0 2px #fde047, 0 4px 10px rgba(0, 0, 0, 0.18);
    }

    /* SVG 畫線標示層 */
    .bingo-lines-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .bingo-line-bg {
      stroke: #ffffff;
      stroke-width: 7;
      stroke-linecap: round;
      opacity: 0.9;
    }

    .bingo-line-fg {
      stroke: #ef4444;
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-dasharray: 150;
      stroke-dashoffset: 150;
      animation: drawLine 0.55s ease-out forwards;
    }

    @keyframes drawLine {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* 原生 Dialog 彈窗樣式 (答對/答錯/題庫編輯) */
    dialog {
      margin: auto;
      border: none;
      border-radius: 24px;
      padding: 0;
      max-width: 92vw;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      background: transparent;
    }

    dialog::backdrop {
      background-color: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
    }

    .feedback-card {
      width: min(540px, 90vw);
      background: #ffffff;
      border-radius: 24px;
      padding: 32px 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      position: relative;
      overflow: hidden;
    }

    .feedback-card.correct-theme {
      border: 5px solid #10b981;
      background: radial-gradient(circle at top, #ecfdf5 0%, #ffffff 70%);
    }

    .feedback-card.wrong-theme {
      border: 5px solid #f43f5e;
      background: radial-gradient(circle at top, #fff1f2 0%, #ffffff 70%);
    }

    .feedback-icon {
      font-size: 4.5rem;
      line-height: 1;
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .feedback-title {
      font-size: 2.1rem;
      font-weight: 900;
    }

    .correct-theme .feedback-title { color: #047857; }
    .wrong-theme .feedback-title { color: #be123c; }

    .feedback-sub {
      font-size: 1.1rem;
      color: #475569;
      font-weight: 600;
      line-height: 1.5;
    }

    .new-bingo-alert {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border: 2px solid #f59e0b;
      color: #92400e;
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 800;
      display: none;
    }

    .new-bingo-alert.show {
      display: block;
    }

    /* 老師題庫管理後台 Dialog */
    .editor-card {
      width: min(860px, 94vw);
      max-height: 88vh;
      background: #ffffff;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #cbd5e1;
    }

    .editor-header {
      padding: 16px 22px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .editor-body {
      padding: 18px 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .unit-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      background: #eff6ff;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #bfdbfe;
    }

    .unit-bar select, .unit-bar input {
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid #93c5fd;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .editor-questions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (max-width: 720px) {
      .editor-questions-grid {
        grid-template-columns: 1fr;
      }
    }

    .q-edit-row {
      display: grid;
      grid-template-columns: 38px 1fr 120px 76px;
      gap: 6px;
      align-items: center;
      background: #f8fafc;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }

    .q-edit-num {
      font-weight: 800;
      font-size: 0.85rem;
      color: #fff;
      background: var(--primary);
      border-radius: 6px;
      text-align: center;
      padding: 4px 0;
    }

    .q-edit-row input, .q-edit-row select {
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.86rem;
      width: 100%;
    }

    .batch-paste-box {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .batch-paste-box.open {
      display: flex;
    }

    .batch-paste-box textarea {
      width: 100%;
      height: 110px;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #94a3b8;
      font-size: 0.85rem;
      font-family: inherit;
    }

    .editor-footer {
      padding: 14px 22px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
  </style>
</head>
<body>

  <!-- 頂部導覽與設定列 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">🎯 課堂賓果分組大挑戰</span>
      <span id="currentUnitBadge" class="unit-badge">預設範例題庫</span>
      <span id="syncStatusBadge" class="sync-status">💾 本機自動儲存就緒</span>
    </div>

    <div class="toolbar-actions">
      <div class="group-switcher" role="group" aria-label="選擇分組數量">
        <span>分組數：</span>
        <button type="button" class="grp-btn" onclick="changeGroupCount(2)" id="grpBtn2">2組</button>
        <button type="button" class="grp-btn" onclick="changeGroupCount(3)" id="grpBtn3">3組</button>
        <button type="button" class="grp-btn active" onclick="changeGroupCount(4)" id="grpBtn4">4組</button>
        <button type="button" class="grp-btn" onclick="changeGroupCount(5)" id="grpBtn5">5組</button>
      </div>

      <button type="button" class="btn btn-outline" onclick="shuffleAllBoards()" title="重新隨機排列各組的 1~16 數字">
        🔀 重排各組數字
      </button>
      <button type="button" class="btn btn-outline" onclick="resetGameProgress()" title="清除答題顏色紀錄，重新開始本局">
        🔄 新局重置
      </button>
      <button type="button" class="btn btn-indigo" onclick="openEditorDialog()">
        ⚙️ 老師改題目
      </button>
    </div>
  </header>

  <!-- 上半部：左題目區 (含 TTS 語音) + 右 4x4 (1~16) 選題區 -->
  <section class="upper-section">
    <!-- 左側題目與作答判定區 -->
    <div class="question-panel">
      <div class="question-header">
        <div class="q-badge-wrap">
          <span id="activeQNumber" class="q-number-badge">第 1 題</span>
          <span id="activeQStatus" class="q-status-tag" style="background:#e2e8f0;color:#475569;">尚未作答</span>
        </div>

        <div class="tts-controls">
          <label class="tts-toggle-label">
            <input type="checkbox" id="autoTtsCheckbox" checked>
            選題自動唸題
          </label>
          <label class="tts-toggle-label">
            語速：
            <select id="ttsRateSelect" style="border:none;background:transparent;font-weight:700;cursor:pointer;">
              <option value="1">正常 (1.0x)</option>
              <option value="0.8">慢速 (0.8x)</option>
              <option value="1.15">快速 (1.15x)</option>
            </select>
          </label>
          <button type="button" class="btn btn-primary" onclick="speakCurrentQuestion()">
            🔊 TTS 語音唸題
          </button>
        </div>
      </div>

      <div class="question-stage">
        <div id="questionTextDisplay" class="question-text">請點選右側 1～16 題號開始答題！</div>
        <div id="answerRevealBox" class="answer-reveal-box">💡 參考答案：蘋果</div>
      </div>

      <div class="judge-bar">
        <div style="display:flex;align-items:center;gap:8px;">
          <button type="button" class="btn btn-outline" onclick="toggleAnswerReveal()">
            💡 顯示/隱藏答案
          </button>
          <button type="button" class="btn btn-outline" onclick="pickRandomUnanswered()">
            🎲 隨機抽題
          </button>
        </div>

        <div class="judge-buttons">
          <button type="button" class="btn btn-correct" onclick="handleJudgeResult(true)">
            ⭕ 答對！（跳畫面＋亮燈）
          </button>
          <button type="button" class="btn btn-wrong" onclick="handleJudgeResult(false)">
            ❌ 答錯！（跳畫面）
          </button>
        </div>
      </div>
    </div>

    <!-- 右側 4x4 (1~16) 題號選擇區 -->
    <div class="selector-panel">
      <div class="selector-header">
        <span class="selector-title">🔢 題號選擇區 (4×4)</span>
        <span id="progressCounter" style="font-size:0.82rem;font-weight:700;color:var(--text-muted);">已答對 0 / 16 題</span>
      </div>
      <div id="questionSelectorGrid" class="selector-grid">
        <!-- JS 產生 1~16 按鈕 -->
      </div>
    </div>
  </section>

  <!-- 下半部：2~5 組隨機 4x4 賓果盤 -->
  <section id="groupsContainer" class="groups-section groups-count-4">
    <!-- JS 產生各組賓果盤與 SVG 連線標示 -->
  </section>

  <!-- 答對 / 答錯 獨立互動畫面 Dialog (支援 light-dismiss) -->
  <dialog id="feedbackDialog" closedby="any" aria-labelledby="feedbackTitle">
    <div id="feedbackCard" class="feedback-card correct-theme">
      <div id="feedbackIcon" class="feedback-icon">🎉</div>
      <h2 id="feedbackTitle" class="feedback-title">太棒了！答對了！</h2>
      <p id="feedbackSub" class="feedback-sub">所有組別賓果盤上的數字已同步變色亮起！</p>
      <div id="newBingoAlert" class="new-bingo-alert">🎊 恭喜達成新連線！</div>
      <div style="margin-top:8px;display:flex;gap:10px;">
        <button type="button" class="btn btn-primary" style="padding:10px 28px;font-size:1.05rem;" onclick="closeFeedbackDialog()">
          ↩ 回到主畫面
        </button>
      </div>
    </div>
  </dialog>

  <!-- 老師改題目後台 Dialog (支援 light-dismiss) -->
  <dialog id="editorDialog" closedby="any" aria-labelledby="editorDialogTitle">
    <div class="editor-card">
      <div class="editor-header">
        <div>
          <h2 id="editorDialogTitle" style="font-size:1.15rem;font-weight:800;">⚙️ 老師題庫管理後台（1～16 題）</h2>
          <p style="font-size:0.8rem;color:var(--text-muted);">修改後會自動儲存於瀏覽器本機（亦可選填自訂雲端 API）</p>
        </div>
        <div style="display:flex;gap:8px;">
          <button type="button" class="btn btn-outline" onclick="toggleBatchPaste()">📋 批次貼上 16 題</button>
          <button type="button" class="btn btn-outline" onclick="closeEditorDialog()">✕ 關閉</button>
        </div>
      </div>

      <div class="editor-body">
        <!-- 題庫單元選擇與命名 -->
        <div class="unit-bar">
          <span style="font-size:0.88rem;font-weight:800;color:#1e40af;">📚 題庫單元：</span>
          <select id="unitSelect" onchange="onSelectUnitChange()"></select>
          <input type="text" id="unitTitleInput" placeholder="輸入題庫單元名稱..." style="flex:1;min-width:180px;">
          <button type="button" class="btn btn-outline" onclick="createNewUnit()">＋ 新增單元</button>
          <button type="button" class="btn btn-outline" style="color:#e11d48;" onclick="deleteCurrentUnit()">🗑️ 刪除單元</button>
        </div>

        <!-- 批次貼上區 -->
        <div id="batchPasteBox" class="batch-paste-box">
          <div style="font-size:0.84rem;font-weight:700;color:#334155;">
            請貼上最多 16 行題目（每行一題，若包含答案可用逗號或 Tab 分隔，例如：<code>請問 Apple 是什麼意思？,蘋果</code>）
          </div>
          <textarea id="batchPasteTextarea" placeholder="第1題題目,答案&#10;第2題題目,答案&#10;..."></textarea>
          <div style="display:flex;justify-content:flex-end;gap:8px;">
            <button type="button" class="btn btn-primary" onclick="applyBatchPaste()">✓ 套用至下方 1～16 題</button>
          </div>
        </div>

        <!-- 1~16 題編輯表單 -->
        <div id="editorQuestionsGrid" class="editor-questions-grid">
          <!-- JS 動態渲染 1~16 題輸入框 -->
        </div>
      </div>

      <div class="editor-footer">
        <div style="display:flex;align-items:center;gap:8px;font-size:0.8rem;color:var(--text-muted);">
          <span>☁️ 雲端 API：</span>
          <input type="text" id="workerUrlInput" placeholder="" style="padding:4px 8px;border:1px solid #cbd5e1;border-radius:6px;width:270px;font-size:0.78rem;">
        </div>
        <div style="display:flex;gap:10px;">
          <button type="button" class="btn btn-outline" onclick="closeEditorDialog()">取消</button>
          <button type="button" class="btn btn-primary" onclick="saveQuestionsFromEditor()">💾 儲存題庫並套用</button>
        </div>
      </div>
    </div>
  </dialog>

  <script>
    // ==========================================
    // 1. 預設題庫與全域狀態
    // ==========================================
    const STORAGE_KEY = 'classroom_bingo_state_v1';
    const DEFAULT_WORKER_URL = '';

    const DEFAULT_QUESTIONS = [
      { num: 1, text: "請問英文單字「Apple」的中文意思是什麼？", answer: "蘋果", lang: "zh-TW" },
      { num: 2, text: "請問英文單字「Banana」的中文意思是什麼？", answer: "香蕉", lang: "zh-TW" },
      { num: 3, text: "請問「7 × 8」等於多少？", answer: "56", lang: "zh-TW" },
      { num: 4, text: "台灣最高的山是什麼山？", answer: "玉山", lang: "zh-TW" },
      { num: 5, text: "請問英文單字「Elephant」的中文意思是什麼？", answer: "大象", lang: "zh-TW" },
      { num: 6, text: "一年之中有幾個月份是 31 天？", answer: "7 個月", lang: "zh-TW" },
      { num: 7, text: "請問「太陽從哪一個方向升起」？", answer: "東方", lang: "zh-TW" },
      { num: 8, text: "請問英文「Good morning」是什麼意思？", answer: "早安", lang: "zh-TW" },
      { num: 9, text: "請問「100 減去 37」等於多少？", answer: "63", lang: "zh-TW" },
      { num: 10, text: "水在攝氏幾度時會結冰？", answer: "0 度", lang: "zh-TW" },
      { num: 11, text: "請問英文單字「Rainbow」的中文意思是什麼？", answer: "彩虹", lang: "zh-TW" },
      { num: 12, text: "一個正方形有幾條對稱軸？", answer: "4 條", lang: "zh-TW" },
      { num: 13, text: "請問英文單字「Library」的中文意思是什麼？", answer: "圖書館", lang: "zh-TW" },
      { num: 14, text: "蜘蛛有幾隻腳？", answer: "8 隻腳", lang: "zh-TW" },
      { num: 15, text: "請問「9 × 6」等於多少？", answer: "54", lang: "zh-TW" },
      { num: 16, text: "火警報案專線是幾號？", answer: "119", lang: "zh-TW" }
    ];

    const GROUP_PALETTES = [
      { name: "第 1 組", border: "#fda4af", badge: "#e11d48", cellLit: "#f43f5e" },
      { name: "第 2 組", border: "#fcd34d", badge: "#d97706", cellLit: "#f59e0b" },
      { name: "第 3 組", border: "#6ee7b7", badge: "#059669", cellLit: "#10b981" },
      { name: "第 4 組", border: "#93c5fd", badge: "#2563eb", cellLit: "#3b82f6" },
      { name: "第 5 組", border: "#d8b4fe", badge: "#7c3aed", cellLit: "#8b5cf6" }
    ];

    // 4x4 賓果所有 10 條連線定義 (格號 index 0~15 及對應 SVG 座標百分比)
    const BINGO_LINES = [
      // 4 條橫線
      { indices: [0, 1, 2, 3], x1: 6, y1: 12.5, x2: 94, y2: 12.5 },
      { indices: [4, 5, 6, 7], x1: 6, y1: 37.5, x2: 94, y2: 37.5 },
      { indices: [8, 9, 10, 11], x1: 6, y1: 62.5, x2: 94, y2: 62.5 },
      { indices: [12, 13, 14, 15], x1: 6, y1: 87.5, x2: 94, y2: 87.5 },
      // 4 條直線
      { indices: [0, 4, 8, 12], x1: 12.5, y1: 6, x2: 12.5, y2: 94 },
      { indices: [1, 5, 9, 13], x1: 37.5, y1: 6, x2: 37.5, y2: 94 },
      { indices: [2, 6, 10, 14], x1: 62.5, y1: 6, x2: 62.5, y2: 94 },
      { indices: [3, 7, 11, 15], x1: 87.5, y1: 6, x2: 87.5, y2: 94 },
      // 2 條斜線
      { indices: [0, 5, 10, 15], x1: 8, y1: 8, x2: 92, y2: 92 },
      { indices: [3, 6, 9, 12], x1: 92, y1: 8, x2: 8, y2: 92 }
    ];

    let state = {
      workerUrl: DEFAULT_WORKER_URL,
      groupCount: 4,
      currentNum: 1,
      questionStatus: {}, // { 1: 'correct' | 'wrong' }
      groups: [],         // [{ name, numbers: [1..16], lineCount: 0 }]
      unitSets: [
        { id: 1, title: "預設範例題庫（綜合問答 16 題）", questions: JSON.parse(JSON.stringify(DEFAULT_QUESTIONS)) }
      ],
      currentUnitIndex: 0
    };

    // ==========================================
    // 2. 工具函式：隨機洗牌、音效合成、TTS 語音
    // ==========================================
    function generateShuffled16() {
      const arr = Array.from({ length: 16 }, (_, i) => i + 1);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function playSoundEffect(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        if (type === 'correct') {
          // 歡快上揚和弦 (C5 - E5 - G5 - C6)
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.18, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + 0.36);
          });
        } else if (type === 'wrong') {
          // 低音提示 (G3 -> Eb3)
          [196.0, 155.56].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.14, now + idx * 0.18);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.18 + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.18);
            osc.stop(now + idx * 0.18 + 0.32);
          });
        }
      } catch (e) {
        // 忽略瀏覽器未解鎖音效的狀況
      }
    }

    function speakCurrentQuestion() {
      if (!('speechSynthesis' in window)) {
        alert('您的瀏覽器不支援 TTS 語音朗讀功能');
        return;
      }
      const qObj = getCurrentQuestions().find(q => q.num === state.currentNum);
      if (!qObj || !qObj.text) return;

      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(qObj.text);
      utter.lang = qObj.lang || 'zh-TW';
      utter.rate = parseFloat(document.getElementById('ttsRateSelect').value) || 1.0;
      window.speechSynthesis.speak(utter);
    }

    // ==========================================
    // 3. 狀態存取與雲端 D1 同步
    // ==========================================
    function getCurrentUnit() {
      return state.unitSets[state.currentUnitIndex] || state.unitSets[0];
    }

    function getCurrentQuestions() {
      const unit = getCurrentUnit();
      return unit ? unit.questions : DEFAULT_QUESTIONS;
    }

    function saveLocalState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = { ...state, ...parsed };
        }
      } catch (e) {}

      if (!Array.isArray(state.groups) || state.groups.length < 5) {
        state.groups = GROUP_PALETTES.map(p => ({
          name: p.name,
          numbers: generateShuffled16(),
          lineCount: 0
        }));
      }
    }

    async function fetchCloudUnits() {
      const badge = document.getElementById('syncStatusBadge');
      if (!state.workerUrl) return;
      try {
        badge.textContent = '☁️ 雲端同步中...';
        const res = await fetch(`${state.workerUrl.replace(/\/$/, '')}/api/sets`);
        const data = await res.json();
        if (data && data.ok && Array.isArray(data.sets) && data.sets.length > 0) {
          state.unitSets = data.sets;
          if (state.currentUnitIndex >= state.unitSets.length) {
            state.currentUnitIndex = 0;
          }
          saveLocalState();
          renderAll();
          badge.textContent = '☁️ D1 雲端已同步';
        }
      } catch (err) {
        badge.textContent = '💾 本機模式（離線可用）';
      }
    }

    async function syncUnitToCloud(unit) {
      const badge = document.getElementById('syncStatusBadge');
      if (!state.workerUrl) return;
      try {
        badge.textContent = '☁️ 正在儲存至 D1...';
        const res = await fetch(`${state.workerUrl.replace(/\/$/, '')}/api/sets`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: unit.id,
            title: unit.title,
            questions: unit.questions
          })
        });
        const data = await res.json();
        if (data && data.ok) {
          if (data.id) unit.id = data.id;
          saveLocalState();
          badge.textContent = '✅ 已儲存至 Cloudflare D1';
        }
      } catch (err) {
        badge.textContent = '💾 已存本機（雲端未連線）';
      }
    }

    // ==========================================
    // 4. 畫面渲染邏輯 (題目、1~16 選題區、各組賓果盤 + SVG 畫線)
    // ==========================================
    function renderAll() {
      const unit = getCurrentUnit();
      document.getElementById('currentUnitBadge').textContent = unit ? unit.title : '預設題庫';

      // 分組按鈕狀態
      [2, 3, 4, 5].forEach(n => {
        const btn = document.getElementById(`grpBtn${n}`);
        if (btn) btn.classList.toggle('active', state.groupCount === n);
      });

      renderQuestionStage();
      renderSelectorGrid();
      renderGroupBoards();
    }

    function renderQuestionStage() {
      const questions = getCurrentQuestions();
      const qObj = questions.find(q => q.num === state.currentNum) || {
        num: state.currentNum,
        text: `第 ${state.currentNum} 題`,
        answer: ''
      };

      document.getElementById('activeQNumber').textContent = `第 ${qObj.num} 題`;
      document.getElementById('questionTextDisplay').textContent = qObj.text;

      const ansBox = document.getElementById('answerRevealBox');
      ansBox.textContent = qObj.answer ? `💡 參考答案：${qObj.answer}` : '💡（本題未設定參考答案）';
      ansBox.classList.remove('visible');

      const st = state.questionStatus[qObj.num];
      const tag = document.getElementById('activeQStatus');
      if (st === 'correct') {
        tag.textContent = '✓ 已答對（各組已亮燈）';
        tag.style.background = '#d1fae5';
        tag.style.color = '#065f46';
      } else if (st === 'wrong') {
        tag.textContent = '✗ 曾答錯（可再次挑戰）';
        tag.style.background = '#fef3c7';
        tag.style.color = '#92400e';
      } else {
        tag.textContent = '尚未作答';
        tag.style.background = '#e2e8f0';
        tag.style.color = '#475569';
      }
    }

    function renderSelectorGrid() {
      const grid = document.getElementById('questionSelectorGrid');
      let correctCount = 0;

      let html = '';
      for (let num = 1; num <= 16; num++) {
        const st = state.questionStatus[num];
        if (st === 'correct') correctCount++;
        const isCurrent = state.currentNum === num;

        let cls = 'q-num-btn';
        if (isCurrent) cls += ' current';
        if (st === 'correct') cls += ' answered-correct';
        else if (st === 'wrong') cls += ' answered-wrong';

        const label = st === 'correct' ? `${num} ✓` : num;
        html += `<button type="button" class="${cls}" onclick="selectQuestionNumber(${num})">${label}</button>`;
      }

      grid.innerHTML = html;
      document.getElementById('progressCounter').textContent = `已答對 ${correctCount} / 16 題`;
    }

    function evaluateBoardLines(numbers) {
      const completedLines = [];
      const cellsInLines = new Set();

      BINGO_LINES.forEach(line => {
        const isComplete = line.indices.every(idx => {
          const num = numbers[idx];
          return state.questionStatus[num] === 'correct';
        });
        if (isComplete) {
          completedLines.push(line);
          line.indices.forEach(idx => cellsInLines.add(idx));
        }
      });

      return { completedLines, cellsInLines };
    }

    function renderGroupBoards() {
      const container = document.getElementById('groupsContainer');
      container.className = `groups-section groups-count-${state.groupCount}`;

      let html = '';
      for (let i = 0; i < state.groupCount; i++) {
        const grp = state.groups[i];
        const palette = GROUP_PALETTES[i];
        const { completedLines, cellsInLines } = evaluateBoardLines(grp.numbers);
        grp.lineCount = completedLines.length;

        const hasBingoClass = completedLines.length > 0 ? 'has-bingo' : '';
        const lineBadgeClass = completedLines.length > 0 ? 'line-counter active-lines' : 'line-counter';

        const cellsHtml = grp.numbers.map((num, idx) => {
          const isLit = state.questionStatus[num] === 'correct';
          const isCurrent = state.currentNum === num && !isLit;
          const isInLine = cellsInLines.has(idx);

          let cellCls = 'bingo-cell';
          let inlineStyle = '';
          if (isLit) {
            cellCls += ' lit';
            inlineStyle = `background:${palette.cellLit};border-color:${palette.badge};`;
          } else if (isCurrent) {
            cellCls += ' current-highlight';
          }
          if (isInLine) {
            cellCls += ' in-line';
          }

          return `<div class="${cellCls}" style="${inlineStyle}" onclick="selectQuestionNumber(${num})" title="點擊切換至第 ${num} 題">${num}</div>`;
        }).join('');

        // 產生連線 SVG 畫線標示
        const svgLinesHtml = completedLines.map(line => `
          <line class="bingo-line-bg" x1="${line.x1}" y1="${line.y1}" x2="${line.x2}" y2="${line.y2}" />
          <line class="bingo-line-fg" x1="${line.x1}" y1="${line.y1}" x2="${line.x2}" y2="${line.y2}" />
        `).join('');

        html += `
          <div class="group-card ${hasBingoClass}" style="border-color:${palette.border};">
            <div class="group-card-header">
              <span class="group-name-badge" style="background:${palette.badge};" onclick="renameGroup(${i})" title="點擊修改組別名稱">
                ${grp.name} ✎
              </span>
              <span class="${lineBadgeClass}">
                🏆 連線：${completedLines.length} 條
              </span>
            </div>
            <div class="bingo-board-wrap">
              <div class="bingo-grid">
                ${cellsHtml}
              </div>
              <svg class="bingo-lines-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                ${svgLinesHtml}
              </svg>
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // ==========================================
    // 5. 互動操作：選題、答對/答錯彈窗、分組與洗牌
    // ==========================================
    function selectQuestionNumber(num) {
      state.currentNum = num;
      saveLocalState();
      renderAll();

      const autoTts = document.getElementById('autoTtsCheckbox');
      if (autoTts && autoTts.checked) {
        speakCurrentQuestion();
      }
    }

    function pickRandomUnanswered() {
      const remaining = [];
      for (let n = 1; n <= 16; n++) {
        if (state.questionStatus[n] !== 'correct') remaining.push(n);
      }
      if (remaining.length === 0) {
        alert('🎉 16 道題目已經全部答對囉！可以點選右上角「🔄 新局重置」開始下一局。');
        return;
      }
      const chosen = remaining[Math.floor(Math.random() * remaining.length)];
      selectQuestionNumber(chosen);
    }

    function toggleAnswerReveal() {
      const ansBox = document.getElementById('answerRevealBox');
      ansBox.classList.toggle('visible');
    }

    function handleJudgeResult(isCorrect) {
      const num = state.currentNum;

      // 記錄原本各組的連線數，用來檢查是否有新連線產生
      const prevLines = state.groups.slice(0, state.groupCount).map(g => evaluateBoardLines(g.numbers).completedLines.length);

      if (isCorrect) {
        state.questionStatus[num] = 'correct';
        playSoundEffect('correct');
      } else {
        if (state.questionStatus[num] !== 'correct') {
          state.questionStatus[num] = 'wrong';
        }
        playSoundEffect('wrong');
      }

      saveLocalState();
      renderAll();

      // 檢查哪些組別新增了連線
      const newlyBingoGroups = [];
      if (isCorrect) {
        for (let i = 0; i < state.groupCount; i++) {
          const newCount = evaluateBoardLines(state.groups[i].numbers).completedLines.length;
          if (newCount > prevLines[i]) {
            newlyBingoGroups.push(`${state.groups[i].name}（共 ${newCount} 條線）`);
          }
        }
      }

      showFeedbackModal(isCorrect, num, newlyBingoGroups);
    }

    function showFeedbackModal(isCorrect, num, newlyBingoGroups) {
      const dialog = document.getElementById('feedbackDialog');
      const card = document.getElementById('feedbackCard');
      const icon = document.getElementById('feedbackIcon');
      const title = document.getElementById('feedbackTitle');
      const sub = document.getElementById('feedbackSub');
      const alertBox = document.getElementById('newBingoAlert');

      const qObj = getCurrentQuestions().find(q => q.num === num);
      const ansText = qObj && qObj.answer ? `（正確答案：${qObj.answer}）` : '';

      if (isCorrect) {
        card.className = 'feedback-card correct-theme';
        icon.textContent = '🎉';
        title.textContent = `第 ${num} 題・答對了！`;
        sub.textContent = `太棒了！所有組別賓果盤上的「數字 ${num}」已經一起變色亮起！${ansText}`;

        if (newlyBingoGroups.length > 0) {
          alertBox.textContent = `🎊 賓果連線成功：${newlyBingoGroups.join('、')}！`;
          alertBox.classList.add('show');
        } else {
          alertBox.classList.remove('show');
        }
      } else {
        card.className = 'feedback-card wrong-theme';
        icon.textContent = '💪';
        title.textContent = `第 ${num} 題・答錯了！`;
        sub.textContent = `別灰心，再接再厲！返回主畫面後可請其他組別挑戰或重試。`;
        alertBox.classList.remove('show');
      }

      dialog.showModal();
    }

    function closeFeedbackDialog() {
      document.getElementById('feedbackDialog').close();
    }

    function changeGroupCount(count) {
      state.groupCount = count;
      saveLocalState();
      renderAll();
    }

    function renameGroup(index) {
      const currentName = state.groups[index].name;
      const nextName = prompt('請輸入新的組別名稱：', currentName);
      if (nextName && nextName.trim()) {
        state.groups[index].name = nextName.trim();
        saveLocalState();
        renderAll();
      }
    }

    function shuffleAllBoards() {
      if (!confirm('確定要重新隨機排列所有組別的 1～16 賓果數字嗎？')) return;
      state.groups.forEach(g => {
        g.numbers = generateShuffled16();
      });
      saveLocalState();
      renderAll();
    }

    function resetGameProgress() {
      if (!confirm('確定要清除本局已答題的變色紀錄，重新開始新的一局嗎？')) return;
      state.questionStatus = {};
      state.currentNum = 1;
      saveLocalState();
      renderAll();
    }

    // ==========================================
    // 6. 老師題庫管理後台
    // ==========================================
    function openEditorDialog() {
      document.getElementById('workerUrlInput').value = state.workerUrl || DEFAULT_WORKER_URL;
      populateUnitSelect();
      renderEditorInputs();
      document.getElementById('editorDialog').showModal();
    }

    function closeEditorDialog() {
      document.getElementById('editorDialog').close();
    }

    function populateUnitSelect() {
      const sel = document.getElementById('unitSelect');
      sel.innerHTML = state.unitSets.map((u, idx) =>
        `<option value="${idx}" ${idx === state.currentUnitIndex ? 'selected' : ''}>${u.title}</option>`
      ).join('');
      const unit = getCurrentUnit();
      document.getElementById('unitTitleInput').value = unit ? unit.title : '';
    }

    function onSelectUnitChange() {
      const idx = Number(document.getElementById('unitSelect').value);
      state.currentUnitIndex = idx;
      const unit = getCurrentUnit();
      document.getElementById('unitTitleInput').value = unit ? unit.title : '';
      renderEditorInputs();
      renderAll();
    }

    function renderEditorInputs() {
      const questions = getCurrentQuestions();
      const container = document.getElementById('editorQuestionsGrid');
      let html = '';

      for (let i = 1; i <= 16; i++) {
        const q = questions.find(item => item.num === i) || { num: i, text: '', answer: '', lang: 'zh-TW' };
        const safeText = (q.text || '').replace(/"/g, '&quot;');
        const safeAns = (q.answer || '').replace(/"/g, '&quot;');
        html += `
          <div class="q-edit-row">
            <span class="q-edit-num">#${i}</span>
            <input type="text" id="editQText_${i}" value="${safeText}" placeholder="輸入第 ${i} 題題目...">
            <input type="text" id="editQAns_${i}" value="${safeAns}" placeholder="答案(選填)">
            <select id="editQLang_${i}">
              <option value="zh-TW" ${q.lang !== 'en-US' ? 'selected' : ''}>中文語音</option>
              <option value="en-US" ${q.lang === 'en-US' ? 'selected' : ''}>英文語音</option>
            </select>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function toggleBatchPaste() {
      document.getElementById('batchPasteBox').classList.toggle('open');
    }

    function applyBatchPaste() {
      const raw = document.getElementById('batchPasteTextarea').value.trim();
      if (!raw) return;
      const lines = raw.split(/\r?\n/).filter(l => l.trim().length > 0);
      lines.slice(0, 16).forEach((line, idx) => {
        const num = idx + 1;
        const parts = line.split(/[\t,，]/);
        const qText = (parts[0] || '').trim();
        const qAns = (parts.slice(1).join(' ') || '').trim();
        const textInput = document.getElementById(`editQText_${num}`);
        const ansInput = document.getElementById(`editQAns_${num}`);
        if (textInput && qText) textInput.value = qText;
        if (ansInput && qAns) ansInput.value = qAns;
      });
      document.getElementById('batchPasteBox').classList.remove('open');
    }

    function createNewUnit() {
      const name = prompt('請輸入新題庫單元的名稱：', `新單元題庫 (${state.unitSets.length + 1})`);
      if (!name || !name.trim()) return;
      const newUnit = {
        id: null,
        title: name.trim(),
        questions: Array.from({ length: 16 }, (_, i) => ({
          num: i + 1,
          text: `第 ${i + 1} 題題目`,
          answer: '',
          lang: 'zh-TW'
        }))
      };
      state.unitSets.push(newUnit);
      state.currentUnitIndex = state.unitSets.length - 1;
      populateUnitSelect();
      renderEditorInputs();
    }

    async function deleteCurrentUnit() {
      if (state.unitSets.length <= 1) {
        alert('至少需保留一組題庫單元！');
        return;
      }
      const unit = getCurrentUnit();
      if (!confirm(`確定要刪除「${unit.title}」題庫嗎？`)) return;

      if (unit.id && state.workerUrl) {
        try {
          await fetch(`${state.workerUrl.replace(/\/$/, '')}/api/sets/${unit.id}`, { method: 'DELETE' });
        } catch (e) {}
      }

      state.unitSets.splice(state.currentUnitIndex, 1);
      state.currentUnitIndex = 0;
      saveLocalState();
      populateUnitSelect();
      renderEditorInputs();
      renderAll();
    }

    async function saveQuestionsFromEditor() {
      const unit = getCurrentUnit();
      const newTitle = document.getElementById('unitTitleInput').value.trim() || '未命名題庫';
      unit.title = newTitle;

      const updatedQuestions = [];
      for (let i = 1; i <= 16; i++) {
        const textVal = document.getElementById(`editQText_${i}`).value.trim() || `第 ${i} 題`;
        const ansVal = document.getElementById(`editQAns_${i}`).value.trim();
        const langVal = document.getElementById(`editQLang_${i}`).value;
        updatedQuestions.push({ num: i, text: textVal, answer: ansVal, lang: langVal });
      }
      unit.questions = updatedQuestions;

      const workerInputVal = document.getElementById('workerUrlInput').value.trim();
      if (workerInputVal) state.workerUrl = workerInputVal;

      saveLocalState();
      renderAll();
      closeEditorDialog();

      await syncUnitToCloud(unit);
    }

    // ==========================================
    // 7. Dialog Light-Dismiss 相容性 Fallback (Safari 等)
    // ==========================================
    function setupDialogLightDismissFallback() {
      if (!('closedBy' in HTMLDialogElement.prototype)) {
        document.querySelectorAll('dialog[closedby="any"]').forEach((dialog) => {
          dialog.addEventListener('click', (event) => {
            if (event.target !== dialog) return;
            const rect = dialog.getBoundingClientRect();
            const isDialogContent = (
              rect.top <= event.clientY &&
              event.clientY <= rect.top + rect.height &&
              rect.left <= event.clientX &&
              event.clientX <= rect.left + rect.width
            );
            if (isDialogContent) return;
            dialog.close();
          });
        });
      }
    }

    // 啟動初始化
    window.addEventListener('DOMContentLoaded', () => {
      loadLocalState();
      setupDialogLightDismissFallback();
      renderAll();
      fetchCloudUnits();
    });
  </script>
</body>
</html>
